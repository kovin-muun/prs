name: Claude Review
on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true

env:
  MAX_DIFF_LINES: 100000
  MAX_BUDGET_USD: "3.00"

jobs:
  review:
    name: Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Resolve PR number
        id: pr-number
        run: echo "value=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check for supported tech stacks
        id: stack-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUPPORTED_FILES=$(gh pr diff ${{ steps.pr-number.outputs.value }} --name-only | grep -cE '\.(java|kt|go|swift)$' || true)
          if [ "$SUPPORTED_FILES" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Claude review — no files from a supported tech stack changed"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check diff size
        id: diff-check
        if: steps.stack-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.pr-number.outputs.value }}"
          DIFF_LINES=$(gh pr diff "$PR" | wc -l)
          echo "diff_lines=$DIFF_LINES" >> "$GITHUB_OUTPUT"
          if [ "$DIFF_LINES" -gt "$MAX_DIFF_LINES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Claude review — diff is $DIFF_LINES lines (limit: $MAX_DIFF_LINES)"
            gh pr comment "$PR" --body "⚠️ **Claude review skipped** — this PR's diff is $DIFF_LINES lines, which exceeds the $MAX_DIFF_LINES-line limit. Please request a manual review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose review prompt
        id: review-prompt
        if: steps.stack-check.outputs.skip != 'true' && steps.diff-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.pr-number.outputs.value }}"
          {
            echo "value<<__PROMPT_EOF__"
            bash .github/workflows/ci/compose-prompt.sh "$PR" "${{ github.repository }}" "${{ env.MAX_BUDGET_USD }}" "${{ runner.temp }}/review-system.md"
            echo "__PROMPT_EOF__"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@46a42b43239748e5b25771606bf1f551c3b1b517 # v1.0.232
        id: claude-review
        if: steps.stack-check.outputs.skip != 'true' && steps.diff-check.outputs.skip != 'true'
        env:
          # Drop the git-status snapshot (branch, recent commits) from Claude
          # Code's system prompt — it is the only per-PR byte ahead of the
          # review guidance, and it breaks prompt-cache sharing across runs.
          CLAUDE_CODE_DISABLE_GIT_INSTRUCTIONS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: false
          show_full_output: true
          prompt: ${{ steps.review-prompt.outputs.value }}
          claude_args: |
            --model claude-opus-5-5 --max-budget-usd ${{ env.MAX_BUDGET_USD }} --append-system-prompt-file "${{ runner.temp }}/review-system.md" --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash,Read,Glob,Grep"

      - name: Handle review failure
        if: always() && steps.claude-review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          MAX_BUDGET: ${{ env.MAX_BUDGET_USD }}
        run: |
          PR="${{ steps.pr-number.outputs.value }}"
          LOGS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            COST=$(jq -s 'map(select(.total_cost_usd)) | last | .total_cost_usd' "$EXECUTION_FILE" 2>/dev/null)
            if [ -n "$COST" ] && [ "$COST" != "null" ] && [ "$(echo "$COST > $MAX_BUDGET" | bc)" = "1" ]; then
              FORMATTED=$(printf '%.2f' "$COST")
              gh pr comment "$PR" --body "⚠️ **Claude review stopped** — cost (\$$FORMATTED) exceeded the \$$MAX_BUDGET budget limit. The review was cut short. See [logs]($LOGS_URL)."
              exit 0
            fi
          fi

          gh pr comment "$PR" --body "⚠️ **Claude review failed** — see [workflow logs]($LOGS_URL) for details."
