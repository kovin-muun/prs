name: Muun Review
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
      reviewer:
        description: 'Reviewer to run'
        type: choice
        options: [both, claude, codex]
        default: both
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

env:
  MAX_DIFF_LINES: 100000

jobs:
  first-run:
    name: First run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post usage instructions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body '🔍 **Claude will review this PR automatically.** To request a follow-up review after new pushes, comment `claude review`.'

  re-run:
    name: Re-run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (contains(github.event.comment.body, 'claude review') ||
        contains(github.event.comment.body, 'codex review') ||
        contains(github.event.comment.body, 'muun review')))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      claude: ${{ steps.reviewers.outputs.claude }}
      codex: ${{ steps.reviewers.outputs.codex }}
    steps:
      - name: Select reviewers
        id: reviewers
        env:
          REVIEWER: ${{ github.event.inputs.reviewer }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          CLAUDE=false CODEX=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "$REVIEWER" != "codex" ] && CLAUDE=true
            [ "$REVIEWER" != "claude" ] && CODEX=true
          else
            grep -qiE 'claude review|muun review' <<<"$COMMENT" && CLAUDE=true
            grep -qiE 'codex review|muun review' <<<"$COMMENT" && CODEX=true
          fi
          echo "claude=$CLAUDE" >> "$GITHUB_OUTPUT"
          echo "codex=$CODEX" >> "$GITHUB_OUTPUT"

      - name: Acknowledge comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content='+1'

  checks:
    name: Checks
    needs: [first-run, re-run]
    if: >-
      always() &&
      (needs.first-run.result == 'success' || needs.re-run.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr_number: ${{ steps.pr-number.outputs.value }}
      skip: ${{ steps.stack-check.outputs.skip == 'true' || steps.diff-check.outputs.skip == 'true' }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve PR number
        id: pr-number
        run: echo "value=${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}" >> "$GITHUB_OUTPUT"

      - name: Check for supported tech stacks
        id: stack-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUPPORTED_FILES=$(gh pr diff ${{ steps.pr-number.outputs.value }} --name-only | grep -cE '\.(java|kt|go|swift)$' || true)
          if [ "$SUPPORTED_FILES" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping reviews — no files from a supported tech stack changed"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check diff size
        id: diff-check
        if: steps.stack-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.pr-number.outputs.value }}"
          DIFF_LINES=$(gh pr diff "$PR" | wc -l)
          if [ "$DIFF_LINES" -gt "$MAX_DIFF_LINES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping reviews — diff is $DIFF_LINES lines (limit: $MAX_DIFF_LINES)"
            gh pr comment "$PR" --body "⚠️ **Review skipped** — this PR's diff is $DIFF_LINES lines, which exceeds the $MAX_DIFF_LINES-line limit. Please request a manual review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  claude:
    name: Claude
    needs: [first-run, re-run, checks]
    if: >-
      always() && needs.checks.result == 'success' &&
      (needs.first-run.result == 'success' || needs.re-run.outputs.claude == 'true')
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/claude-review.yml
    with:
      pr_number: ${{ needs.checks.outputs.pr_number }}
      skip: ${{ needs.checks.outputs.skip == 'true' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  codex:
    name: Codex
    # Runs after the Claude review so Codex can read Claude's comments.
    needs: [first-run, re-run, checks, claude]
    if: always() && needs.checks.result == 'success' && needs.re-run.outputs.codex == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/codex-review.yml
    with:
      pr_number: ${{ needs.checks.outputs.pr_number }}
      skip: ${{ needs.checks.outputs.skip == 'true' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
