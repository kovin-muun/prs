name: Security Review
on:
  pull_request:
    types: [opened, ready_for_review]

env:
  # The upstream action pins Node 18, where npm installs Claude Code 2.1.197, which rejects current
  # models. This workflow runs a copy of its scripts, in .github/security-review, with these
  # versions.
  CLAUDE_CODE_VERSION: 2.1.316
  CLAUDE_MODEL: claude-opus-5-5
  # Cost cap for the Claude Code scan. The filter's per-finding API calls are not included.
  MAX_BUDGET_USD: "10.00"

jobs:
  review:
    name: Run
    # Fork and Dependabot PRs get no ANTHROPIC_API_KEY. GitHub's diff API, which the scan needs,
    # rejects PRs with more than 300 changed files.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.changed_files <= 300 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-review')
    runs-on: ubuntu-latest
    # There is no cost cap like --max-budget-usd. Each scan attempt times out after 20 minutes.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # This workflow runs from the PR's merge commit, but a PR branch cut before it was added has
      # no config files or scripts at its head. The default ref is the merge commit, which always
      # has them.
      - name: Check out review config and scripts
        uses: actions/checkout@v6
        with:
          path: .security-review-config
          sparse-checkout: |
            .github/workflows/ci/security-review-instructions.md
            .github/workflows/ci/security-review-filter.md
            .github/security-review/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Claude reviews the checkout, so keep the config and scripts out of it.
      - name: Move review config and scripts out of the checkout
        run: |
          mv .security-review-config/.github/workflows/ci/security-review-*.md "$RUNNER_TEMP/"
          mv .security-review-config/.github/security-review "$RUNNER_TEMP/security-review"
          rm -rf .security-review-config

      # claude runs in the checkout, which would load the repo's developer settings: Bash
      # allowlist, hooks and telemetry env. Nested directories hold skills that claude can also
      # load.
      - name: Remove Claude Code project settings
        run: find . -name .claude -type d -prune -exec rm -rf {} +

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q requests==2.34.2 anthropic==2.4.0

      # The script exits with 1 when it finds a HIGH severity issue, so its exit code is not a
      # failure signal. The next step checks the results instead.
      - name: Run security scan
        working-directory: ${{ runner.temp }}/security-review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENABLE_CLAUDE_FILTERING: "true"
          REPO_PATH: ${{ github.workspace }}
          PYTHONPATH: ${{ runner.temp }}/security-review
          CUSTOM_SECURITY_SCAN_INSTRUCTIONS: ${{ runner.temp }}/security-review-instructions.md
          FALSE_POSITIVE_FILTERING_INSTRUCTIONS: ${{ runner.temp }}/security-review-filter.md
        run: |
          "$RUNNER_TEMP/venv/bin/python" -u claudecode/github_action_audit.py \
            > "$RUNNER_TEMP/results.json" 2> "$RUNNER_TEMP/error.log" || true

      # When the script cannot parse Claude's output, it reports no findings with review_completed
      # set to false.
      - name: Check scan results
        run: |
          echo "::group::Scan log"
          cat "$RUNNER_TEMP/error.log"
          echo "::endgroup::"
          jq . "$RUNNER_TEMP/results.json" || cat "$RUNNER_TEMP/results.json"
          if ! jq -e 'has("findings") and .analysis_summary.review_completed != false' \
              "$RUNNER_TEMP/results.json" > /dev/null 2>&1; then
            echo "::error::Security scan failed."
            exit 1
          fi

      # The comment script reads findings.json from the working directory and the PR from the event
      # payload. It skips the PR if it already has security comments.
      - name: Post findings
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          jq '.findings' results.json > findings.json
          node security-review/scripts/comment-pr-findings.js
